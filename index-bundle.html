<style>

  :root {
    /* palette */
    --bg: #f5f8f7;
    --surface: #ffffff;
    --ink: #15252b;
    --ink-soft: #46585e;
    --ink-faint: #7d8d92;
    --deep: #0b343c;            /* deep teal — dark sections */
    --deep-2: #0e424b;
    --line: #e2eae9;
    --line-strong: #cfdcda;

    /* accent (overridable by tweaks) */
    --accent: #0f8f86;          /* primary teal */
    --accent-bright: #1ec8b6;   /* bright teal */
    --accent-ink: #064843;      /* dark accent text */
    --accent-wash: #e7f6f3;     /* tinted surface */
    --on-accent: #ffffff;

    /* type */
    --display: "Bricolage Grotesque", sans-serif;
    --body: "DM Sans", sans-serif;
    --mono: "Space Mono", monospace;

    /* metrics */
    --maxw: 1180px;
    --radius: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--accent-bright); color: var(--deep); }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

  /* eyebrow label */
  .eyebrow {
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
    display: inline-flex; align-items: center; gap: 9px;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 1.5px; background: var(--accent); display: inline-block;
  }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--body); font-weight: 600; font-size: 16px;
    padding: 14px 24px; border-radius: 999px; border: 1.5px solid transparent;
    transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 22px -10px var(--accent); }
  .btn-primary:hover { background: var(--accent-ink); transform: translateY(-2px); box-shadow: 0 14px 28px -12px var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-ink); transform: translateY(-2px); }
  .btn-dark { background: var(--deep); color: #fff; }
  .btn-dark:hover { background: var(--deep-2); transform: translateY(-2px); }
  .btn-white { background: #fff; color: var(--deep); }
  .btn-white:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(0,0,0,.5); }

  /* section rhythm */
  .section { padding: 96px 0; }
  .section-head { max-width: 640px; }
  .section-head h2 { font-size: clamp(30px, 4vw, 46px); margin-top: 16px; }
  .section-head p { color: var(--ink-soft); font-size: 19px; margin-top: 14px; }

  /* hexagon motif */
  .hex {
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  /* periodic element tile */
  .el-tile {
    font-family: var(--mono); position: relative; display: flex; flex-direction: column;
    justify-content: space-between; border: 1.5px solid var(--line-strong); border-radius: 10px;
    background: var(--surface); padding: 8px 9px; aspect-ratio: 1; color: var(--ink);
  }
  .el-tile .num { font-size: 10px; color: var(--ink-faint); }
  .el-tile .sym { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  /* scroll reveal */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }

  /* utility card */
  .card {
    background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);

  .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -28px rgba(11,52,60,.4); border-color: var(--line-strong); }

  @media (max-width: 980px) {

    .teacher-grid { grid-template-columns: 1fr !important; gap: 36px !important; }

    .feat-grid { grid-template-columns: 1fr 1fr !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 28px !important; }

    .trust-grid > div { border-left: none !important; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel">
/* TopKemija — shared components */
const { useState, useEffect, useRef } = React;

/* ---- Reveal: fade/slide in on scroll ---- */
function Reveal({ children, delay = 0, as = "div", className = "", style = {} }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { el.classList.add("in"); io.unobserve(el); } }),
      { threshold: 0.12, rootMargin: "0px 0px -8% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms`, ...style }}>
      {children}
    </Tag>
  );
}

/* ---- Eyebrow label ---- */
function Eyebrow({ children, style }) {
  return <span className="eyebrow" style={style}>{children}</span>;
}

/* ---- Periodic-style element tile ---- */
function ElementTile({ num, sym, size = 64, style = {}, accent = false }) {
  return (
    <div className="el-tile" style={{
      width: size, height: size,
      ...(accent ? { borderColor: "var(--accent)", color: "var(--accent-ink)", background: "var(--accent-wash)" } : {}),
      ...style,
    }}>
      <span className="num">{num}</span>
      <span className="sym">{sym}</span>
    </div>
  );
}

/* ---- Single hexagon (decorative) ---- */
function Hexagon({ size = 80, stroke = "var(--accent)", fill = "none", strokeWidth = 1.5, style = {} }) {
  return (
    <svg width={size} height={size * 1.1547} viewBox="0 0 100 115.47" style={style} aria-hidden="true">
      <polygon points="50,2 98,29 98,87 50,114 2,87 2,29"
        fill={fill} stroke={stroke} strokeWidth={strokeWidth} />
    </svg>
  );
}

/* ---- Hex lattice field (background texture) ---- */
function HexField({ opacity = 1, color = "var(--line-strong)", style = {} }) {
  // tiling honeycomb via repeating SVG
  const svg = encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='56' height='96' viewBox='0 0 56 96'>
      <g fill='none' stroke='${color === "var(--line-strong)" ? "%23cfdcda" : color}' stroke-width='1.2'>
        <path d='M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z'/>
        <path d='M28 64 L56 80 L56 112 L28 128 L0 112 L0 80 Z'/>
      </g>
    </svg>`
  );
  return (
    <div aria-hidden="true" style={{
      position: "absolute", inset: 0, opacity: `calc(var(--motif-mult, 1) * ${opacity})`,
      backgroundImage: `url("data:image/svg+xml,${svg}")`,
      backgroundSize: "56px 96px",
      maskImage: "radial-gradient(120% 100% at 50% 0%, #000 35%, transparent 78%)",
      WebkitMaskImage: "radial-gradient(120% 100% at 50% 0%, #000 35%, transparent 78%)",
      ...style,
    }} />
  );
}

/* ---- Simple stroked icons (24x24) ---- */
const Icon = {
  arrow: (p) => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14M13 6l6 6-6 6"/></svg>),
  check: (p) => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M4 12.5l5 5L20 6"/></svg>),
  x: (p) => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 6l12 12M18 6L6 18"/></svg>),
  plus: (p) => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" {...p}><path d="M12 5v14M5 12h14"/></svg>),
  star: (p) => (<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>),
  menu: (p) => (<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" {...p}><path d="M3 6h18M3 12h18M3 18h18"/></svg>),
  flask: (p) => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 3h6M10 3v6L5 18a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7.5 14h9"/></svg>),
};

/* ---- Wordmark / logo ---- */
function Logo({ dark = false, size = 1 }) {
  const ink = dark ? "#fff" : "var(--ink)";
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 10 * size, fontFamily: "var(--display)", fontWeight: 800, fontSize: 21 * size, letterSpacing: "-0.03em", color: ink }}>
      <span style={{ position: "relative", width: 30 * size, height: 34 * size, display: "inline-grid", placeItems: "center" }}>

        <span style={{ position: "relative", color: "#fff", fontFamily: "var(--mono)", fontWeight: 700, fontSize: 14 * size }}>M</span>
      </span>
      <span>Molekula<span style={{ color: "var(--accent)" }}>&nbsp;Academy</span></span>
    </span>
  );
}

Object.assign(window, { Reveal, Eyebrow, ElementTile, Hexagon, HexField, Icon, Logo });

<script type="text/babel">
/* TopKemija — app assembly + tweaks */
const ACCENTS = {
  teal:    { accent: "#0f8f86", bright: "#1ec8b6", ink: "#064843", wash: "#e7f6f3" },
  blue:    { accent: "#2563d8", bright: "#4f9bff", ink: "#12357a", wash: "#e9eefb" },
  emerald: { accent: "#15936a", bright: "#2ed29a", ink: "#0a4a35", wash: "#e6f6ee" },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "hero": "split",
  "accent": "teal",
  "motif": "subtle",
  "displayFont": "Bricolage Grotesque"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = useState(() => (typeof localStorage !== "undefined" && localStorage.getItem("tk_lang")) || "hr");
  const [scrolled, setScrolled] = useState(false);
  const c = window.CONTENT[lang];

  // language persistence + <html lang>
  useEffect(() => {
    try { localStorage.setItem("tk_lang", lang); } catch (e) {}
    document.documentElement.lang = lang;
  }, [lang]);

  // scroll state for nav
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // apply accent palette
  useEffect(() => {
    const a = ACCENTS[t.accent] || ACCENTS.teal;
    const r = document.documentElement.style;
    r.setProperty("--accent", a.accent);
    r.setProperty("--accent-bright", a.bright);
    r.setProperty("--accent-ink", a.ink);
    r.setProperty("--accent-wash", a.wash);
  }, [t.accent]);

  // motif intensity
  useEffect(() => {
    document.documentElement.style.setProperty("--motif-mult", t.motif === "bold" ? "2.1" : "1");
  }, [t.motif]);

  // display font
  useEffect(() => {
    document.documentElement.style.setProperty("--display", `"${t.displayFont}", sans-serif`);
  }, [t.displayFont]);

  return (
    <React.Fragment>
      <Nav c={c} lang={lang} setLang={setLang} scrolled={scrolled} />
      <main>
        <Hero c={c} variant={t.hero} />
        <TrustBar c={c} />
        <WhoFor c={c} />
        <HowItWorks c={c} />
        <Features c={c} />
        <Teacher c={c} />
        <Testimonials c={c} />
        <Pricing c={c} />
        <FAQ c={c} />
        <FinalCTA c={c} />
      </main>
      <Footer c={c} lang={lang} setLang={setLang} />

      <TweaksPanel>
        <TweakSection label={lang === "hr" ? "Hero" : "Hero section"} />
        <TweakRadio label={lang === "hr" ? "Smjer" : "Direction"} value={t.hero}
          options={["split", "centered", "equation"]}
          onChange={(v) => setTweak("hero", v)} />
        <TweakSection label={lang === "hr" ? "Stil" : "Style"} />
        <TweakColor label={lang === "hr" ? "Naglasak" : "Accent"} value={ACCENTS[t.accent].accent}
          options={[ACCENTS.teal.accent, ACCENTS.blue.accent, ACCENTS.emerald.accent]}
          onChange={(hex) => {
            const key = Object.keys(ACCENTS).find((k) => ACCENTS[k].accent === hex) || "teal";
            setTweak("accent", key);
          }} />
        <TweakRadio label={lang === "hr" ? "Uzorak" : "Hex motif"} value={t.motif}
          options={["subtle", "bold"]}
          onChange={(v) => setTweak("motif", v)} />
        <TweakRadio label={lang === "hr" ? "Naslovni font" : "Display font"} value={t.displayFont}
          options={["Bricolage Grotesque", "Space Grotesk"]}
          onChange={(v) => setTweak("displayFont", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
