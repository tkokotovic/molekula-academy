<!-- ============================================
     MOLEKULA ACADEMY — Section 03: Trust Bar
     Light strip between hero and "Who this is for".
     Update the numbers as real students enrol.
     ============================================ -->

<style>
  .trust {
    background: #f8faf9;
    border-top: 1px solid #e2ebe8;
    border-bottom: 1px solid #e2ebe8;
    padding: 40px 32px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .trust__inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .trust__label {
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Stats row */
  .trust__stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 100%;
    flex-wrap: wrap;
  }
  .trust__stat {
    flex: 1;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0 32px;
    position: relative;
  }
  .trust__stat + .trust__stat::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10%;
    height: 80%;
    width: 1px;
    background: #d1e0da;
  }
  .trust__stat-number {
    font-size: 32px;
    font-weight: 800;
    color: #0d1a2e;
    letter-spacing: -1px;
    line-height: 1;
  }
  .trust__stat-number span { color: #0d7a6a; }
  .trust__stat-desc {
    font-size: 13px;
    color: #64748b;
    text-align: center;
    line-height: 1.4;
  }

  /* Subject badges */
  .trust__badges {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .trust__badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    border: 1px solid #d1e0da;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    color: #374151;
  }

  @media (max-width: 600px) {
    .trust__stat + .trust__stat::before { display: none; }
    .trust__stat { padding: 12px 16px; }
  }
</style>

<section class="trust">
  <div class="trust__inner">

    <p class="trust__label">Built around the exams that decide your future</p>

    <div class="trust__stats">
      <div class="trust__stat">
        <div class="trust__stat-number">1000<span>+</span></div>
        <div class="trust__stat-desc">Practice questions<br>per exam type</div>
      </div>
      <div class="trust__stat">
        <div class="trust__stat-number">1<span>:1</span></div>
        <div class="trust__stat-desc">Live sessions<br>with the teacher</div>
      </div>
      <div class="trust__stat">
        <div class="trust__stat-number">2</div>
        <div class="trust__stat-desc">Languages &mdash;<br>Croatian &amp; English</div>
      </div>
    </div>

    <div class="trust__badges">
      <div class="trust__badge">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1l1.5 3 3.3.5-2.4 2.3.6 3.2L7 8.5 4 10l.6-3.2L2.2 4.5l3.3-.5L7 1z" fill="#0d7a6a"/>
        </svg>
        IB Chemistry HL &amp; SL
      </div>
      <div class="trust__badge">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1l1.5 3 3.3.5-2.4 2.3.6 3.2L7 8.5 4 10l.6-3.2L2.2 4.5l3.3-.5L7 1z" fill="#0d7a6a"/>
        </svg>
        Medical &amp; Dental Entrance
      </div>
      <div class="trust__badge">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1l1.5 3 3.3.5-2.4 2.3.6 3.2L7 8.5 4 10l.6-3.2L2.2 4.5l3.3-.5L7 1z" fill="#0d7a6a"/>
        </svg>
        Medical Chemistry
      </div>
      <div class="trust__badge">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1l1.5 3 3.3.5-2.4 2.3.6 3.2L7 8.5 4 10l.6-3.2L2.2 4.5l3.3-.5L7 1z" fill="#0d7a6a"/>
        </svg>
        Biochemistry
      </div>
    </div>

  </div>
</section>
