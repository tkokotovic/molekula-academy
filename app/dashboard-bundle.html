<!DOCTYPE html>
<html lang="hr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Molekula Academy — Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   MOLEKULA ACADEMY — DESIGN SYSTEM TOKENS
   Single source of truth for color, type, spacing & motion.
   Import this first, before any page or component styles:
     <link rel="stylesheet" href="tokens.css" />
   ============================================================ */

:root {
  /* ---- SURFACES & INK ---- */
  --bg: #f5f8f7;            /* page background — cool off-white */
  --surface: #ffffff;       /* cards, raised panels */
  --ink: #15252b;           /* primary text — near-black teal */
  --ink-soft: #46585e;      /* secondary text */
  --ink-faint: #7d8d92;     /* tertiary / captions */
  --line: #e2eae9;          /* hairline borders */
  --line-strong: #cfdcda;   /* stronger borders, dividers */

  /* ---- DEEP (dark sections) ---- */
  --deep: #0b343c;          /* deep teal — dark section bg */
  --deep-2: #0e424b;        /* hover / layered deep */

  /* ---- ACCENT (default: Teal) ----
     Swap the whole 4-token group to re-theme. See palettes below. */
  --accent: #0f8f86;        /* primary accent */
  --accent-bright: #1ec8b6; /* bright accent — highlights, popular badge */
  --accent-ink: #064843;    /* accent text on light surfaces */
  --accent-wash: #e7f6f3;   /* tinted accent surface */
  --on-accent: #ffffff;     /* text/icon on accent fills */

  /* ---- TYPE FAMILIES ---- */
  --display: "Bricolage Grotesque", sans-serif; /* headings, wordmark */
  --body: "DM Sans", sans-serif;                /* body copy, UI */
  --mono: "Space Mono", monospace;              /* eyebrows, formulas, element tiles */

  /* ---- TYPE SCALE (px) ---- */
  --t-eyebrow: 12px;        /* mono, uppercase, tracked */
  --t-caption: 13px;
  --t-body-sm: 15px;
  --t-body: 17px;
  --t-body-lg: 19px;
  --t-h4: 18px;
  --t-h3: 24px;
  --t-h2: clamp(30px, 4vw, 46px);
  --t-h1: clamp(38px, 5vw, 62px);
  --t-display: clamp(40px, 6vw, 76px); /* centered hero */

  /* ---- SPACING SCALE ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 28px;
  --sp-7: 40px;
  --sp-8: 56px;
  --sp-section: 96px;       /* vertical rhythm between sections */

  /* ---- RADII ---- */
  --radius: 18px;           /* cards, large panels */
  --radius-sm: 12px;        /* small cards, inputs */
  --radius-pill: 999px;     /* buttons, chips, toggles */
  --radius-tile: 10px;      /* periodic element tiles */

  /* ---- ELEVATION ---- */
  --shadow-card: 0 20px 40px -28px rgba(11,52,60,.4);
  --shadow-pop: 0 30px 60px -34px rgba(11,52,60,.6);
  --shadow-accent: 0 8px 22px -10px var(--accent);

  /* ---- LAYOUT ---- */
  --maxw: 1180px;
  --gutter: 28px;

  /* ---- MOTION ---- */
  --ease: cubic-bezier(.2,.7,.2,1);
  --dur-fast: .18s;
  --dur: .3s;
  --dur-reveal: .7s;

  /* ---- MOTIF ---- */
  --motif-mult: 1;          /* hex-field opacity multiplier (subtle=1, bold=2.1) */
}

/* ============================================================
   ACCENT PALETTES — apply one by setting the 4 accent tokens.
   Default above is Teal. To switch, override on :root or a scope:
     [data-accent="blue"]    { ...blue tokens... }
   ============================================================ */
[data-accent="teal"] {
  --accent: #0f8f86; --accent-bright: #1ec8b6; --accent-ink: #064843; --accent-wash: #e7f6f3;
}
[data-accent="blue"] {
  --accent: #2563d8; --accent-bright: #4f9bff; --accent-ink: #12357a; --accent-wash: #e9eefb;
}
[data-accent="emerald"] {
  --accent: #15936a; --accent-bright: #2ed29a; --accent-ink: #0a4a35; --accent-wash: #e6f6ee;
}

</style>
<style>
/* ============================================================
   MOLEKULA ACADEMY — COMPONENT PRIMITIVES
   Reusable classes built on tokens.css. Import order:
     <link rel="stylesheet" href="tokens.css" />
     <link rel="stylesheet" href="components.css" />
   ============================================================ */

/* ---- BASE ---- */
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: var(--t-body); line-height: 1.6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
::selection { background: var(--accent-bright); color: var(--deep); }

/* ---- LAYOUT ---- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
.section { padding: var(--sp-section) 0; }

/* ---- EYEBROW LABEL ---- */
.eyebrow {
  font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  display: inline-flex; align-items: center; gap: 9px;
}
.eyebrow::before { content: ""; width: 22px; height: 1.5px; background: var(--accent); display: inline-block; }

/* ---- BUTTONS ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-family: var(--body); font-weight: 600; font-size: 16px;
  padding: 14px 24px; border-radius: var(--radius-pill); border: 1.5px solid transparent;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease),
              color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
  white-space: nowrap; cursor: pointer;
}
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent); }
.btn-primary:hover { background: var(--accent-ink); transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent-ink); transform: translateY(-2px); }
.btn-dark { background: var(--deep); color: #fff; }
.btn-dark:hover { background: var(--deep-2); transform: translateY(-2px); }
.btn-white { background: #fff; color: var(--deep); }
.btn-white:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(0,0,0,.5); }

/* ---- CARD ---- */
.card {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); border-color: var(--line-strong); }

/* ---- CHIP / BADGE ---- */
.chip {
  font-family: var(--mono); font-size: 12.5px; padding: 8px 14px;
  border-radius: var(--radius-pill); border: 1.5px solid var(--line-strong); color: var(--ink-soft);
}
.badge-popular {
  background: var(--accent-bright); color: var(--deep); font-family: var(--mono);
  font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 14px; border-radius: var(--radius-pill);
}

/* ---- HEXAGON MOTIF ---- */
.hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
.hex-accent { background: var(--accent); }
.hex-wash {
  background: var(--accent-wash); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--mono); font-weight: 700;
}

/* ---- PERIODIC ELEMENT TILE ---- */
.el-tile {
  font-family: var(--mono); position: relative; display: flex; flex-direction: column;
  justify-content: space-between; border: 1.5px solid var(--line-strong); border-radius: var(--radius-tile);
  background: var(--surface); padding: 8px 9px; aspect-ratio: 1; color: var(--ink); width: 64px; height: 64px;
}
.el-tile.is-accent { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-wash); }
.el-tile .num { font-size: 10px; color: var(--ink-faint); }
.el-tile .sym { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

/* ---- REVEAL (scroll animation) ---- */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity var(--dur-reveal) var(--ease), transform var(--dur-reveal) var(--ease); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

</style>
<style>
/* ============================================================
   MOLEKULA ACADEMY — APP SHELL (dashboard / lesson / quiz)
   Builds on tokens.css + components.css.
   ============================================================ */

/* ---- DARK MODE: remap surface/ink tokens ---- */
[data-theme="dark"] {
  --bg: #0a2026;
  --surface: #0f2d34;
  --ink: #eaf4f2;
  --ink-soft: #a7c0bf;
  --ink-faint: #6f8d8c;
  --line: #1b3d44;
  --line-strong: #28525a;
  --deep: #08191e;
  --deep-2: #0c2229;
  --shadow-card: 0 20px 40px -28px rgba(0,0,0,.6);
  --shadow-pop: 0 30px 60px -34px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); transition: background .3s var(--ease), color .3s var(--ease); }

/* ---- APP GRID ---- */
.app { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }

/* ---- SIDEBAR ---- */
.side {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 16px;
  transition: background .3s var(--ease), border-color .3s var(--ease);
}
.side-logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.03em; padding: 6px 8px 0; color: var(--ink); }
.side-logo .mk { position: relative; width: 28px; height: 32px; display: inline-grid; place-items: center; }
.side-logo .mk i { position: absolute; inset: 0; }
.side-logo .mk span { position: relative; color: #fff; font-family: var(--mono); font-weight: 700; font-size: 13px; }

.side-nav { margin-top: 26px; display: grid; gap: 3px; }
.side-link {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px;
  font-size: 14.5px; font-weight: 500; color: var(--ink-soft); cursor: pointer; border: none; background: none;
  text-align: left; width: 100%; transition: background .15s, color .15s; font-family: var(--body);
}
.side-link:hover { background: var(--accent-wash); color: var(--accent-ink); }
.side-link.active { background: var(--accent); color: var(--on-accent); }
.side-link.active svg { color: var(--on-accent); }
.side-link svg { width: 19px; height: 19px; flex-shrink: 0; color: currentColor; }
.side-sep { height: 1px; background: var(--line); margin: 14px 8px; }

.side-foot { margin-top: auto; padding-top: 18px; }
.side-card {
  background: var(--deep); color: #fff; border-radius: 14px; padding: 16px; position: relative; overflow: hidden;
}
.side-card h5 { font-family: var(--display); font-size: 15px; margin: 0; color: #fff; }
.side-card p { font-size: 12.5px; color: rgba(255,255,255,.7); margin: 4px 0 12px; }

/* ---- TOPBAR ---- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px;
  padding: 16px 32px; background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--line);
}
.search {
  flex: 1; max-width: 420px; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-pill);
  padding: 9px 16px; color: var(--ink-faint);
}
.search input { border: none; background: none; outline: none; flex: 1; font-family: var(--body); font-size: 14.5px; color: var(--ink); }
.search input::placeholder { color: var(--ink-faint); }

.icon-btn {
  width: 40px; height: 40px; border-radius: var(--radius-pill); border: 1.5px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-soft);
  transition: border-color .15s, color .15s; position: relative;
}
.icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }

.avatar {
  display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border-radius: var(--radius-pill);
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
}
.avatar .pic { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 13px; }
.avatar .nm { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.avatar .pl { font-family: var(--mono); font-size: 10px; color: var(--accent-ink); }

/* lang toggle (reused) */
.lang-toggle { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: var(--radius-pill); padding: 3px; background: var(--surface); font-family: var(--mono); font-size: 12px; font-weight: 700; }
.lang-toggle button { border: none; border-radius: var(--radius-pill); padding: 5px 10px; letter-spacing: .06em; background: transparent; color: var(--ink-faint); cursor: pointer; transition: background .2s, color .2s; }
.lang-toggle button.on { background: var(--accent); color: #fff; }

/* ---- CONTENT ---- */
.content { padding: 28px 32px 64px; max-width: 1180px; }
.page-head h1 { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: var(--ink); }
.page-head p { color: var(--ink-soft); margin-top: 6px; font-size: 16px; }

.dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 26px; align-items: start; }
.col { display: grid; gap: 20px; }

.panel {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 22px; transition: background .3s var(--ease), border-color .3s var(--ease);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.panel-head h3 { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--ink); letter-spacing: -0.01em; }
.panel-head a { font-size: 13px; color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }

/* continue / hero card */
.continue {
  position: relative; overflow: hidden; background: var(--deep); color: #fff; border-radius: var(--radius);
  padding: 28px; border: 1.5px solid var(--deep);
}
.continue h2 { font-family: var(--display); font-weight: 800; font-size: 26px; color: #fff; letter-spacing: -0.02em; margin-top: 8px; }
.continue .meta { font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.65); margin-top: 8px; }
.progress-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 18px; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--accent-bright); transition: width .6s var(--ease); }

/* course rows */
.course-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
.course-row + .course-row { border-top: 1px solid var(--line); }
.course-row .mini-track { flex: 1; }
.course-row .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 7px; }
.course-row .bar i { display: block; height: 100%; border-radius: 999px; }
.course-row .nm { font-weight: 600; font-size: 14.5px; color: var(--ink); }
.course-row .ct { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.course-row .pct { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink); }

/* stat pills */
.stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; }
.stat .v { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--ink); letter-spacing: -0.02em; }
.stat .l { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

/* bar chart */
.chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding-top: 6px; }
.chart .barwrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart .barwrap > i { width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--accent); transition: height .6s var(--ease); }
.chart .barwrap > i.peak { background: var(--accent-bright); }
.chart .barwrap span { font-family: var(--mono); font-size: 9px; color: var(--ink-faint); }

/* topic mastery */
.topic { margin-top: 12px; }
.topic .tl { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 5px; }
.topic .tl b { color: var(--ink); font-weight: 600; }
.topic .bar { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
.topic .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

/* zoom card */
.zoom { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-ink) 100%); color: #fff; border: none; }
.zoom h3 { color: #fff; }
.zoom .when { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 6px; }
.zoom .when .d { font-family: var(--display); font-weight: 800; font-size: 22px; color: #fff; }
.zoom .when .t { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,.85); }
.zoom .tp { font-size: 14.5px; color: rgba(255,255,255,.92); margin-top: 10px; }
.zoom .wh { font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.7); margin-top: 3px; }

/* quiz result rows */
.qr { display: flex; align-items: center; gap: 14px; padding: 11px 0; }
.qr + .qr { border-top: 1px solid var(--line); }
.qr .ring { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 13px; flex-shrink: 0; }
.qr .info { flex: 1; }
.qr .info .nm { font-weight: 600; font-size: 14px; color: var(--ink); }
.qr .info .mt { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

/* deadlines */
.dl { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.dl + .dl { border-top: 1px solid var(--line); }
.dl .tk { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.dl .tk.urgent { background: #e8743b; }
.dl .nm { flex: 1; font-size: 14px; color: var(--ink); font-weight: 500; }
.dl .due { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }

/* ============ LESSON PAGE ============ */
.lesson-grid { display: grid; grid-template-columns: 1fr 280px; gap: 28px; margin-top: 24px; align-items: start; }
.breadcrumb { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; color: var(--ink-faint); display: flex; gap: 8px; align-items: center; }
.breadcrumb b { color: var(--accent-ink); }
.lesson-body h1 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -0.02em; color: var(--ink); margin-top: 12px; }
.lesson-body .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
.video-slot {
  margin-top: 24px; aspect-ratio: 16/9; border-radius: var(--radius); overflow: hidden; position: relative;
  background: repeating-linear-gradient(135deg, var(--deep) 0 18px, var(--deep-2) 18px 36px);
  display: grid; place-items: center; border: 1.5px solid var(--line-strong);
}
.video-slot .play { width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); }
.video-slot .play svg { color: var(--deep); margin-left: 3px; }
.video-slot .lbl { position: absolute; bottom: 14px; left: 16px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.video-slot .dur { position: absolute; bottom: 14px; right: 16px; font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,.9); background: rgba(0,0,0,.4); padding: 3px 8px; border-radius: 6px; }
.prose h2 { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--ink); margin-top: 30px; letter-spacing: -0.01em; }
.prose p { color: var(--ink-soft); font-size: 17px; line-height: 1.7; margin-top: 12px; }
.keypoint { margin-top: 26px; background: var(--accent-wash); border: 1.5px solid var(--accent); border-radius: var(--radius-sm); padding: 18px 20px; }
.keypoint .kt { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
.keypoint p { color: var(--accent-ink); font-size: 15.5px; margin-top: 8px; line-height: 1.6; }
.eq-strip { margin-top: 22px; font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 16px 20px; text-align: center; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--line); }

/* outline sidebar */
.outline { position: sticky; top: 90px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px; }
.outline .ol { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); padding: 0 6px 10px; }
.ol-item { display: flex; align-items: center; gap: 11px; padding: 9px 8px; border-radius: 10px; cursor: pointer; transition: background .15s; }
.ol-item:hover { background: var(--bg); }
.ol-item.current { background: var(--accent-wash); }
.ol-item .chk { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; border: 1.5px solid var(--line-strong); font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.ol-item .chk.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.ol-item .chk.cur { border-color: var(--accent); color: var(--accent-ink); }
.ol-item .t { font-size: 13.5px; color: var(--ink-soft); }
.ol-item.current .t { color: var(--accent-ink); font-weight: 600; }

/* ============ QUIZ ============ */
.quiz-wrap { max-width: 720px; margin: 0 auto; }
.quiz-top { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.quiz-prog { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 18px 0 28px; }
.quiz-prog i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s var(--ease); }
.q-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 32px; }
.q-num { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--accent-ink); text-transform: uppercase; }
.q-text { font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--ink); margin-top: 12px; letter-spacing: -0.01em; line-height: 1.25; }
.opts { display: grid; gap: 12px; margin-top: 26px; }
.opt {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; text-align: left;
  font-family: var(--body); font-size: 16px; color: var(--ink); transition: border-color .15s, background .15s; width: 100%;
}
.opt:hover { border-color: var(--accent); }
.opt .key { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 13px; background: var(--bg); color: var(--ink-soft); border: 1.5px solid var(--line-strong); }
.opt.selected { border-color: var(--accent); background: var(--accent-wash); }
.opt.selected .key { background: var(--accent); color: #fff; border-color: var(--accent); }
.opt.correct { border-color: #18936a; background: color-mix(in srgb, #18936a 12%, var(--surface)); }
.opt.correct .key { background: #18936a; color: #fff; border-color: #18936a; }
.opt.wrong { border-color: #d6492f; background: color-mix(in srgb, #d6492f 10%, var(--surface)); }
.opt.wrong .key { background: #d6492f; color: #fff; border-color: #d6492f; }
.opt:disabled { cursor: default; }
.feedback { margin-top: 22px; border-radius: var(--radius-sm); padding: 18px 20px; border: 1.5px solid; }
.feedback.ok { background: color-mix(in srgb, #18936a 8%, var(--surface)); border-color: #18936a; }
.feedback.no { background: color-mix(in srgb, #d6492f 7%, var(--surface)); border-color: #d6492f; }
.feedback .ft { font-family: var(--display); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.feedback.ok .ft { color: #0f6b4d; }
.feedback.no .ft { color: #a8341f; }
.feedback p { color: var(--ink-soft); font-size: 15px; margin-top: 8px; line-height: 1.55; }
.quiz-actions { display: flex; justify-content: flex-end; margin-top: 26px; }

/* results */
.result-card { text-align: center; max-width: 540px; margin: 40px auto 0; }
.score-ring { width: 160px; height: 160px; margin: 0 auto 24px; position: relative; display: grid; place-items: center; }
.score-ring .pct { font-family: var(--display); font-weight: 800; font-size: 44px; color: var(--ink); letter-spacing: -0.03em; }
.score-ring .of { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }

/* ---- RESPONSIVE ---- */
@media (max-width: 1040px) {
  .dash-grid { grid-template-columns: 1fr; }
  .lesson-grid { grid-template-columns: 1fr; }
  .outline { position: static; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }

  .app.nav-open .side { transform: none; }
  .nav-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .app.nav-open .nav-scrim { opacity: 1; pointer-events: auto; }
  .stat-row { grid-template-columns: 1fr; }
  .content { padding: 20px; }
  .topbar { padding: 14px 18px; }
  .search { max-width: none; }
  .hide-sm { display: none !important; }
}
@media (min-width: 761px) { .menu-btn, .nav-scrim { display: none; } }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

/* SVG ring for scores */
function Ring({ pct, size = 160, stroke = 13, color = "var(--accent)", track = "var(--line)", children }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ * (1 - pct / 100);
  return (
    <div className="score-ring" style={{ width: size, height: size }}>
      <svg width={size} height={size} style={{ position: "absolute", inset: 0, transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)" }} />
      </svg>
      <div style={{ position: "relative", textAlign: "center" }}>{children}</div>
    </div>
  );
}

function scoreColor(pct) {
  if (pct >= 85) return "#18936a";
  if (pct >= 60) return "var(--accent)";

}

<script type="text/babel">
/* Molekula Academy — Quiz flow (questions → feedback → results) */

function Quiz({ d, go }) {
  const q = d.quiz;
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [checked, setChecked] = useState(false);
  const [answers, setAnswers] = useState([]); // booleans
  const [done, setDone] = useState(false);

  const cur = q.questions[idx];
  const isLast = idx === q.questions.length - 1;
  const keys = ["A", "B", "C", "D"];

  function check() {
    if (selected == null) return;
    setChecked(true);
    setAnswers((a) => { const n = [...a]; n[idx] = selected === cur.answer; return n; });
  }
  function next() {
    if (isLast) { setDone(true); return; }
    setIdx(idx + 1); setSelected(null); setChecked(false);
  }
  function restart() {
    setIdx(0); setSelected(null); setChecked(false); setAnswers([]); setDone(false);
  }

  if (done) {
    const correct = answers.filter(Boolean).length;
    const total = q.questions.length;
    const pct = Math.round((correct / total) * 100);
    const msg = pct >= 85 ? q.results.great : pct >= 60 ? q.results.good : q.results.keepGoing;
    return (
      <div className="content">
        <div className="quiz-wrap">
          <div className="result-card">
            <Ring pct={pct} color={scoreColor(pct)}>
              <div className="pct">{pct}%</div>
              <div className="of">{correct}/{total} {q.results.correctOf}</div>
            </Ring>
            <h1 style={{ fontFamily: "var(--display)", fontWeight: 800, fontSize: 30, color: "var(--ink)", letterSpacing: "-0.02em" }}>{q.results.title}</h1>
            <p style={{ color: "var(--ink-soft)", fontSize: 17, marginTop: 10 }}>{msg}</p>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 28, flexWrap: "wrap" }}>
              <button className="btn btn-ghost" onClick={restart}>{q.results.retake}</button>
              <button className="btn btn-primary" onClick={() => go("lesson")}>{q.results.back}</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="content">
      <div className="quiz-wrap">
        <div className="quiz-top">
          <div>
            <h1 style={{ fontFamily: "var(--display)", fontWeight: 800, fontSize: 24, color: "var(--ink)", letterSpacing: "-0.02em" }}>{q.title}</h1>
            <p style={{ fontFamily: "var(--mono)", fontSize: 12, color: "var(--ink-faint)", marginTop: 6 }}>{q.sub}</p>
          </div>
          <button className="btn btn-ghost" style={{ padding: "9px 16px", fontSize: 13.5 }} onClick={() => go("lesson")}><I.x width="15" height="15" /></button>
        </div>

        <div className="quiz-prog"><i style={{ width: ((idx + (checked ? 1 : 0)) / q.questions.length) * 100 + "%" }}></i></div>

        <div className="q-card">
          <div className="q-num">{q.qLabel} {idx + 1} {q.ofLabel} {q.questions.length}</div>
          <div className="q-text">{cur.q}</div>

          <div className="opts">
            {cur.options.map((opt, i) => {
              let cls = "opt";
              if (checked) {
                if (i === cur.answer) cls += " correct";
                else if (i === selected) cls += " wrong";
              } else if (i === selected) cls += " selected";
              return (
                <button key={i} className={cls} disabled={checked} onClick={() => setSelected(i)}>
                  <span className="key">{checked && i === cur.answer ? <I.check width="14" height="14" /> : (checked && i === selected ? <I.x width="14" height="14" /> : keys[i])}</span>
                  {opt}
                </button>
              );
            })}
          </div>

          {checked && (
            <div className={"feedback " + (selected === cur.answer ? "ok" : "no")}>
              <div className="ft">
                {selected === cur.answer ? <I.check width="18" height="18" /> : <I.x width="18" height="18" />}
                {selected === cur.answer ? q.correct : q.incorrect}
              </div>
              <p>{cur.explain}</p>
            </div>
          )}

          <div className="quiz-actions">
            {!checked
              ? <button className="btn btn-primary" disabled={selected == null} style={{ opacity: selected == null ? .5 : 1 }} onClick={check}>{q.submit}</button>
              : <button className="btn btn-primary" onClick={next}>{isLast ? q.finish : q.nextQ} <I.arrow width="17" height="17" /></button>}
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { Quiz });
</script>
<script type="text/babel">
/* Molekula Academy — Progress screen */

function Sparkline({ values, width = 320, height = 80, color = "var(--accent)" }) {
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 12) - 4;
    return `${x},${y}`;
  });
  const area = `M${pts[0]} ${pts.slice(1).map((p) => "L" + p).join(" ")} L${width},${height} L0,${height} Z`;
  const line = `M${pts[0]} ${pts.slice(1).map((p) => "L" + p).join(" ")}`;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: height, display: "block" }}>
      <defs>
        <linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#spark-fill)" />
      <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => {
        const [x, y] = p.split(",");
        return <circle key={i} cx={x} cy={y} r="3.5" fill={color} opacity={i === values.length - 1 ? 1 : 0.35} />;
      })}
    </svg>
  );
}

function HeatCell({ topic, value }) {
  const opacity = 0.12 + (value / 100) * 0.88;
  const bg = `color-mix(in srgb, var(--accent) ${Math.round(opacity * 100)}%, var(--surface))`;
  const textColor = value >= 65 ? "var(--on-accent)" : "var(--ink)";
  return (
    <div style={{
      background: bg,
      borderRadius: 10,
      padding: "10px 12px",
      display: "flex",
      flexDirection: "column",
      gap: 2,
    }}>
      <span style={{ fontSize: 12, fontWeight: 600, color: value >= 65 ? "rgba(255,255,255,.75)" : "var(--ink-soft)", lineHeight: 1.2 }}>{topic}</span>
      <span style={{ fontSize: 17, fontWeight: 700, color: textColor, fontFamily: "var(--mono)" }}>{value}%</span>
    </div>
  );
}

function CalendarGrid({ sc }) {

  for (let d = 1; d <= sc.daysInMonth; d++) cells.push(d);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 6 }}>

              justifyContent: msg.me ? "flex-end" : "flex-start",

              alignItems: "flex-end",
            }}>
              {!msg.me && (
                <div style={{
                  width: 30, height: 30, borderRadius: "50%",
                  background: "var(--accent)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontWeight: 700, color: "#fff", fontSize: 12,
                  flexShrink: 0,
                }}>T</div>
              )}
              <div style={{ maxWidth: "72%" }}>
                <div style={{
                  background: msg.me ? "var(--accent)" : "var(--bg)",
                  color: msg.me ? "var(--on-accent)" : "var(--ink)",
                  borderRadius: msg.me ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
                  padding: "10px 14px",
                  fontSize: 14.5,
                  lineHeight: 1.5,
                  boxShadow: msg.me ? "var(--shadow-accent)" : "none",
                }}>
                  {msg.text}
                </div>
                <div style={{
                  fontSize: 11,
                  color: "var(--ink-faint)",
                  marginTop: 3,
                  textAlign: msg.me ? "right" : "left",
                  paddingLeft: msg.me ? 0 : 4,
                  paddingRight: msg.me ? 4 : 0,
                }}>
                  {msg.time}
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Compose */}
        <div style={{
          padding: "12px 16px",
          borderTop: "1px solid var(--line)",
          display: "flex",
          gap: 10,
          alignItems: "flex-end",
          flexShrink: 0,
        }}>
          <div style={{
            flex: 1,
            background: "var(--bg)",
            borderRadius: 14,
            border: "1.5px solid var(--line-strong)",
            padding: "10px 14px",
            display: "flex",
            alignItems: "center",
            gap: 8,
          }}>
            <textarea
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onKeyDown={handleKey}
              placeholder={m.placeholder}
              rows={1}
              style={{
                flex: 1,
                border: "none",
                outline: "none",
                background: "transparent",
                resize: "none",
                fontSize: 14.5,
                color: "var(--ink)",
                fontFamily: "var(--body)",
                lineHeight: 1.5,
              }}
            />
            <button className="icon-btn" title="Attach">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M14.5 8.5l-6 6a4 4 0 01-5.66-5.66l6.36-6.36a2.5 2.5 0 013.54 3.54L6.4 12.36a1 1 0 01-1.41-1.41l6-6" stroke="var(--ink-faint)" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>
          <button
            className={"btn btn-primary" + (draft.trim() ? "" : " disabled")}
            style={{ padding: "11px 18px", flexShrink: 0, opacity: draft.trim() ? 1 : 0.45 }}
            onClick={send}
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ display: "inline", verticalAlign: "middle" }}>
              <path d="M14 2L7 9M14 2L9 14 7 9 2 7l12-5z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { MessagesScreen });
</script>
<script type="text/babel">
/* Molekula Academy — Settings screen */

function SettingsRow({ label, children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 20, padding: "14px 0", borderBottom: "1px solid var(--line)" }}>
      <label style={{ fontSize: 14.5, color: "var(--ink)", fontWeight: 500, flexShrink: 0 }}>{label}</label>
      <div style={{ flex: 1, display: "flex", justifyContent: "flex-end" }}>{children}</div>
    </div>
  );
}

function TextInput({ value, placeholder }) {
  const [v, setV] = React.useState(value || "");
  return (
    <input
      value={v}
      onChange={(e) => setV(e.target.value)}
      placeholder={placeholder}
      style={{
        border: "1.5px solid var(--line-strong)",
        borderRadius: 10,
        padding: "8px 12px",
        fontSize: 14,
        color: "var(--ink)",
        background: "var(--bg)",
        outline: "none",
        width: "100%",
        maxWidth: 260,
        fontFamily: "var(--body)",
      }}
    />
  );
}

function SettingsScreen({ d, lang, setLang, go }) {
  const s = d.settings;
  const [saved, setSaved] = React.useState(false);
  const [theme, setTheme] = React.useState("light");

  function save() {
    setSaved(true);
    setTimeout(() => setSaved(false), 2200);
  }

  return (
    <div className="content" style={{ maxWidth: 680 }}>
      <div className="page-head">
        <h1>{s.title}</h1>
        <p>{s.sub}</p>
      </div>

      {/* Profile */}
      <div className="panel" style={{ marginBottom: 20 }}>
        <h3 style={{ fontFamily: "var(--display)", fontWeight: 700, fontSize: 17, marginBottom: 4 }}>{s.profile}</h3>
        <div style={{ borderTop: "1px solid var(--line)", marginTop: 10 }}>
          <SettingsRow label={s.name}>
            <TextInput value="Marta Kovač" />
          </SettingsRow>
          <SettingsRow label={s.email}>
            <TextInput value={s.emailVal} />
          </SettingsRow>
          <SettingsRow label={s.school}>
            <TextInput value={s.schoolVal} />
          </SettingsRow>
        </div>
      </div>

      {/* Subscription */}
      <div className="panel" style={{ marginBottom: 20 }}>
        <h3 style={{ fontFamily: "var(--display)", fontWeight: 700, fontSize: 17, marginBottom: 4 }}>{s.plan}</h3>
        <div style={{
          marginTop: 14,
          padding: "16px 18px",
          background: "var(--accent-wash)",
          borderRadius: 12,
          border: "1.5px solid var(--accent)",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: 16,
          flexWrap: "wrap",
        }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{
                fontWeight: 700,
                fontSize: 16,
                color: "var(--accent-ink)",
                fontFamily: "var(--display)",
              }}>{s.planName}</span>
              <span className="badge-popular" style={{ fontSize: 10.5, padding: "2px 8px" }}>Active</span>
            </div>
            <div style={{ fontSize: 13, color: "var(--ink-soft)", marginTop: 3 }}>{s.planDesc}</div>
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontFamily: "var(--mono)", fontWeight: 700, fontSize: 18, color: "var(--accent-ink)" }}>{s.planPrice}</div>
            <button className="btn btn-ghost" style={{ marginTop: 8, padding: "7px 16px", fontSize: 13 }}>{s.manage}</button>
          </div>
        </div>
      </div>

      {/* Preferences */}
      <div className="panel" style={{ marginBottom: 20 }}>
        <h3 style={{ fontFamily: "var(--display)", fontWeight: 700, fontSize: 17, marginBottom: 4 }}>{s.prefs}</h3>
        <div style={{ borderTop: "1px solid var(--line)", marginTop: 10 }}>

          <SettingsRow label={s.language}>
            <div className="lang-toggle">
              {["hr", "en"].map((L) => (
                <button key={L} className={lang === L ? "on" : ""} onClick={() => setLang && setLang(L)}>
                  {L.toUpperCase()}
                </button>
              ))}
            </div>
          </SettingsRow>

          <SettingsRow label={s.theme}>
            <div style={{ display: "flex", gap: 8 }}>
              {[["light", s.themeLight], ["dark", s.themeDark]].map(([val, label]) => (
                <button
                  key={val}
                  onClick={() => {
                    setTheme(val);
                    document.documentElement.dataset.theme = val;
                    document.body.dataset.theme = val;
                  }}
                  style={{
                    padding: "7px 16px",
                    borderRadius: 99,
                    border: "1.5px solid " + (theme === val ? "var(--accent)" : "var(--line-strong)"),
                    background: theme === val ? "var(--accent-wash)" : "var(--surface)",
                    color: theme === val ? "var(--accent-ink)" : "var(--ink-soft)",
                    fontWeight: theme === val ? 700 : 400,
                    fontSize: 13.5,
                    cursor: "pointer",
                    transition: "all .15s",
                  }}>
                  {label}
                </button>
              ))}
            </div>
          </SettingsRow>

          <SettingsRow label={s.accent}>
            <div style={{ display: "flex", gap: 10 }}>
              {[["teal", "#0f8f86"], ["blue", "#2563d8"], ["emerald", "#15936a"]].map(([name, hex]) => (
                <button
                  key={name}
                  onClick={() => { document.body.dataset.accent = name; }}
                  style={{
                    width: 28, height: 28,
                    borderRadius: "50%",
                    background: hex,
                    border: "2.5px solid var(--surface)",
                    boxShadow: "0 0 0 2px " + hex,
                    cursor: "pointer",
                  }}
                />
              ))}
            </div>
          </SettingsRow>
        </div>
      </div>

      {/* Actions */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
        <button
          className="btn btn-primary"
          style={{ padding: "12px 28px", minWidth: 160 }}
          onClick={save}
        >
          {saved ? s.saved : s.save}
        </button>
        <button
          className="btn btn-ghost"
          style={{ color: "#d93a3a", borderColor: "#d93a3a", padding: "12px 24px" }}
        >
          {s.danger}
        </button>
      </div>
    </div>
  );
}

Object.assign(window, { SettingsScreen });

</script>
<script type="text/babel">
/* Molekula Academy — dashboard app shell + router */

const APP_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "teal",
  "theme": "light"
}/*EDITMODE-END*/;

function Sidebar({ d, screen, go, onNav, lang, setLang }) {
  const items = [
    { k: "dashboard", icon: I.home, label: d.nav.dashboard },
    { k: "courses", icon: I.book, label: d.nav.courses, to: "lesson" },
    { k: "progress", icon: I.chart, label: d.nav.progress, to: "progress" },
    { k: "quizzes", icon: I.quiz, label: d.nav.quizzes, to: "quiz" },
    { k: "schedule", icon: I.cal, label: d.nav.schedule, to: "schedule" },
    { k: "messages", icon: I.chat, label: d.nav.messages, to: "messages" },
  ];
  const activeFor = { dashboard: "dashboard", lesson: "courses", quiz: "quizzes", progress: "progress", schedule: "schedule", messages: "messages", settings: "settings" };
  return (
    <nav className="side">
      <div className="side-logo"><Mark /> Molekula</div>
      <div className="side-nav">
        {items.map((it) => (
          <button key={it.k} className={"side-link" + (activeFor[screen] === it.k ? " active" : "")}
            onClick={() => { go(it.to || it.k === "dashboard" ? (it.to || "dashboard") : "dashboard"); onNav && onNav(); }}>
            <it.icon /> {it.label}
          </button>
        ))}
        <div className="side-sep"></div>
        <button className={"side-link" + (screen === "settings" ? " active" : "")} onClick={() => { go("settings"); onNav && onNav(); }}><I.gear /> {d.nav.settings}</button>
      </div>
      <div className="side-foot">
        <div className="side-card">
          <span className="hex hex-accent" style={{ position: "absolute", width: 70, height: 80, right: -22, top: -22, opacity: .25 }}></span>
          <h5>{d.zoomCard.label}</h5>
          <p>{d.zoomCard.date} · {d.zoomCard.time}</p>
          <button className="btn btn-white" style={{ width: "100%", padding: "9px 14px", fontSize: 13 }}><I.video width="15" height="15" /> {d.zoomCard.cta}</button>
        </div>
      </div>
    </nav>
  );
}

function Topbar({ d, lang, setLang, t, setTweak, onMenu }) {
  const s = d.student;
  return (
    <div className="topbar">
      <button className="icon-btn menu-btn" onClick={onMenu}><I.menu width="20" height="20" /></button>
      <div className="search">
        <I.search width="18" height="18" />
        <input placeholder={d.topbar.search} />
      </div>
      <div style={{ flex: 1 }}></div>
      <div className="lang-toggle hide-sm">
        {["hr", "en"].map((L) => (
          <button key={L} className={lang === L ? "on" : ""} onClick={() => setLang(L)}>{L.toUpperCase()}</button>
        ))}
      </div>
      <button className="icon-btn" title="Theme" onClick={() => setTweak("theme", t.theme === "dark" ? "light" : "dark")}>
        {t.theme === "dark" ? <I.sun width="18" height="18" /> : <I.moon width="18" height="18" />}
      </button>
      <button className="icon-btn hide-sm"><I.bell width="18" height="18" /><span className="dot"></span></button>
      <div className="avatar">
        <span className="pic">{s.name.split(" ").map((w) => w[0]).join("")}</span>
        <span className="hide-sm">
          <span className="nm" style={{ display: "block", lineHeight: 1.1 }}>{s.name}</span>
          <span className="pl">{s.plan} · {s.track}</span>
        </span>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(APP_TWEAK_DEFAULTS);
  const [lang, setLang] = useState(() => (typeof localStorage !== "undefined" && localStorage.getItem("tk_lang")) || "hr");
  const [screen, setScreen] = useState(() => (typeof localStorage !== "undefined" && localStorage.getItem("mol_screen")) || "dashboard");
  const [navOpen, setNavOpen] = useState(false);
  const d = window.APP[lang];

  useEffect(() => { try { localStorage.setItem("tk_lang", lang); } catch (e) {} document.documentElement.lang = lang; }, [lang]);
  useEffect(() => { try { localStorage.setItem("mol_screen", screen); } catch (e) {} window.scrollTo(0, 0); }, [screen]);
  useEffect(() => { document.body.dataset.accent = t.accent; }, [t.accent]);
  useEffect(() => { document.documentElement.dataset.theme = t.theme; document.body.dataset.theme = t.theme; }, [t.theme]);

  function go(s) { setScreen(s); setNavOpen(false); }

  return (
    <div className={"app" + (navOpen ? " nav-open" : "")}>
      <Sidebar d={d} screen={screen} go={go} onNav={() => setNavOpen(false)} lang={lang} setLang={setLang} />
      <div className="nav-scrim" onClick={() => setNavOpen(false)}></div>
      <div>
        <Topbar d={d} lang={lang} setLang={setLang} t={t} setTweak={setTweak} onMenu={() => setNavOpen(true)} />
        {screen === "dashboard" && <Dashboard d={d} go={go} />}
        {screen === "lesson" && <Lesson d={d} go={go} />}
        {screen === "quiz" && <Quiz d={d} go={go} />}
        {screen === "progress" && <ProgressScreen d={d} go={go} />}
        {screen === "schedule" && <ScheduleScreen d={d} go={go} />}
        {screen === "messages" && <MessagesScreen d={d} go={go} />}
        {screen === "settings" && <SettingsScreen d={d} lang={lang} setLang={setLang} go={go} />}
      </div>

      <TweaksPanel>
        <TweakSection label={lang === "hr" ? "Izgled" : "Appearance"} />
        <TweakRadio label={lang === "hr" ? "Tema" : "Theme"} value={t.theme}
          options={["light", "dark"]} onChange={(v) => setTweak("theme", v)} />
        <TweakColor label={lang === "hr" ? "Naglasak" : "Accent"} value={ACCENT_HEX[t.accent]}
          options={[ACCENT_HEX.teal, ACCENT_HEX.blue, ACCENT_HEX.emerald]}
          onChange={(hex) => setTweak("accent", Object.keys(ACCENT_HEX).find((k) => ACCENT_HEX[k] === hex) || "teal")} />
        <TweakSection label={lang === "hr" ? "Ekran" : "Screen"} />
        <TweakRadio label={lang === "hr" ? "Prikaži" : "Show"} value={screen}
          options={["dashboard", "lesson", "quiz", "progress", "schedule", "messages", "settings"]} onChange={(v) => go(v)} />
      </TweaksPanel>
    </div>
  );
}

const ACCENT_HEX = { teal: "#0f8f86", blue: "#2563d8", emerald: "#15936a" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
